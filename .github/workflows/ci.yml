name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_EMAILJS_SERVICE_ID: ci_service
          VITE_EMAILJS_TEMPLATE_ID: ci_template
          VITE_EMAILJS_PUBLIC_KEY: ci_key
        run: npm run build
